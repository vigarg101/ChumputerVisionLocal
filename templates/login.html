<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Portal</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

    <div class="login-wrapper">
        <div class="login-container">
            <header>
                <h1>Login</h1>
                <p class="subtitle">Access your dashboard</p>
            </header>

            <form action="/history" method="POST">

                <div class="form-group">
                    <label for="username">Username</label>
                    <!-- FIXED: Added the input field so the form can actually submit the username -->
                    <input type="text" id="username" name="username" readonly placeholder="Authenticating...">
                </div>

                <div class="form-group">
                    <label for="organization">Organization</label>
                    <input type="text" id="organization" name="organization" readonly placeholder="Auto-filled based on username">
                </div>

                <button type="submit" class="login-btn" id="loginBtn" style="display: none;">Sign In</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            let usersData = [];
            
            const usernameInput = document.getElementById('username');
            const orgInput = document.getElementById('organization');
            const loginBtn = document.getElementById('loginBtn');
                
            fetch('/api/users')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success' && data.users.length > 0) {
                        usersData = data.users;

                        usernameInput.value = usersData[0].username;
                        
                        orgInput.value = usersData[0].organization;

                        loginBtn.textContent = 'Proceed as ' + usersData[0].username;
                        loginBtn.style.display = 'block'; 

                    } else {
                        console.error('Failed to fetch users:', data.message);
                        usernameInput.placeholder = "Authentication Failed";
                    }
                })
                .catch(error => {
                    console.error('Error fetching users:', error);
                    usernameInput.placeholder = "Network Error";
                });

        });
    </script>
</body>
</html>
