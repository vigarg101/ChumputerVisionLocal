<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Portal</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>


    <div class="login-wrapper">
        <div class="login-container">
            <header>
                <h1>Login</h1>
                <p class="subtitle">Access your dashboard</p>
            </header>

            <form action="/history" method="POST">

                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="select-wrapper">
                        <select id="username" name="username" required>
                            <option value="" disabled selected>Select a username...</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="organization">Organization</label>
                    <input type="text" id="organization" name="organization" readonly placeholder="Auto-filled based on username">
                </div>

                <button type="submit" class="login-btn" id="loginBtn" style="display: none;">Sign In</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            

            let usersData = [];
            const usernameSelect = document.getElementById('username');
            const orgInput = document.getElementById('organization');
            const loginBtn = document.getElementById('loginBtn');
                


            fetch('/api/users')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        usersData = data.users;

                        

                        usersData.forEach(user => {
                            const option = document.createElement('option');
                            option.value = user.username;
                            option.textContent = user.username;
                            usernameSelect.appendChild(option);
                        });



                    } else {
                        console.error('Failed to fetch users:', data.message);
                    }
                })
                .catch(error => {
                    console.error('Error fetching users:', error);
                });



            

            usernameSelect.addEventListener('change', function() {
                const selectedUsername = this.value;
                
                const matchedUser = usersData.find(u => u.username === selectedUsername);
                
                if (matchedUser) {
                    orgInput.value = matchedUser.organization;


                    loginBtn.textContent = 'Proceed as ' + matchedUser.username;
                    loginBtn.style.display = 'block'; 
                } else {
                    orgInput.value = '';
                    loginBtn.style.display = 'none';
                }
            });
        });

       

    </script>
</body>
</html>
