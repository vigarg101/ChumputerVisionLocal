<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Visual AI Pipeline Explorer{% endblock %}</title>
    
    <!-- Link to our clean, external stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">×</a>
        <a href="{{ url_for('history_page') }}">Home</a>
        <a href="{{ url_for('upload_approve') }}">Run Models</a> 
    </div>

    <div class="container" id="main"> 
        <header>
            <button class="openbtn" onclick="openNav()">☰ Menu</button> 
            <h1>Chumputer Vision</h1>
            <p class="subtitle">Image cropping, age estimation, & analysis explorer</p>
        </header>

        <main>
            {% block content %}
            {% endblock %}
        </main>

        <footer>
            <p>&copy; 2026 Chumputer Vision.</p>
        </footer>
    </div>

    <script>
        function openNav() {
            document.getElementById("mySidebar").style.width = "250px";
        }

        function closeNav() {
            document.getElementById("mySidebar").style.width = "0";
        }
    </script>

    {% block scripts %}
    {% endblock %}
</body>
</html>
